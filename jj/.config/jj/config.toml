#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Hui Peng Hu"
email = "woohp135@gmail.com"

[ui]
# Match git: delta reads its theme from the [delta] section of ~/.gitconfig.
pager = "delta"
diff-formatter = ":git"
# Git-style <<<<<<< / ||||||| / ======= / >>>>>>> markers instead of jj's diff style.
conflict-marker-style = "git"
paginate = "never"
